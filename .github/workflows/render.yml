# Renders every slug listed in render-queue.txt (one parallel job per video) and
# attaches the finished MP4s to the "videos" release. Triggered by pushing render-queue.txt.
name: Render Shorts
on:
  push:
    branches: [main]
    paths: [render-queue.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.q.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: echo "slugs=$(grep -v '^\s*#' render-queue.txt | grep -v '^\s*$' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - name: Ensure release exists
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release view videos >/dev/null 2>&1 || gh release create videos --title "Curiosity Corner — rendered Shorts" --notes "Finished 1080x1920 Shorts. Upload metadata: see upload-kit/." --latest
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Setup
        run: ./setup.sh
      - name: Voice + sound
        run: |
          python3 engine/voice.py ${{ matrix.slug }}
          python3 engine/sound.py ${{ matrix.slug }}
      - name: Render
        run: node engine/render.mjs ${{ matrix.slug }}
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          N=$(grep -n "^${{ matrix.slug }}$" render-queue.txt | cut -d: -f1)
          cp episodes/${{ matrix.slug }}/${{ matrix.slug }}.mp4 "${{ matrix.slug }}.mp4"
          gh release upload videos "${{ matrix.slug }}.mp4" --clobber
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-${{ matrix.slug }}
          path: episodes/${{ matrix.slug }}/build/*.jpg
          if-no-files-found: ignore
